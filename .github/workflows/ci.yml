# CI for nomorals-2.0 — THIN CALLER (thin-caller contract, census §3B.4).
#
# This file holds no job bodies: it declares name/on/permissions/
# concurrency and calls the shared workflow, which owns the lint
# ratchet, layering, error scan, collection gate, offline suite and
# secret scan.  A caller job with its own runs-on/steps is refused by
# `python3 -m nomorals.tools.ci_contract check .github/workflows`
# (enforced inside the shared workflow itself).
#
# Concurrency belongs here, not in the shared workflow: a reusable
# workflow cannot set it for the run.

name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR branch cancels its older run. Every push to main
# gets its own run, so each state of main is checked to the end.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ./.github/workflows/shared-ci.yml
    with:
      python-versions: '["3.11", "3.12"]'
      shards: "[0, 1]"
      suite-timeout-minutes: 90
