# CI for nomorals-2.0.
#
# What runs on every push / PR:
#   - lint: the repo's own linter (ruff, per [tool.ruff] in pyproject.toml).
#   - layering: tests/test_layering.py — the architecture contract.
#   - error_scan: nomorals.tools.error_scan over the package.
#   - offline unit suite: ONE canonical runner — `pytest` over tests/,
#     sharded deterministically by file — with NM_RUN_INTEGRATION unset,
#     so only the offline tiers run. (Until Batch A this step executed
#     `unittest discover`, which silently never ran the ~15k collected
#     plain-function tests; pytest executes both populations.)
#
# Gates (block): the ruff lint-debt RATCHET (ruff-ratchet.json — per-code
# ceilings that may only decrease) and the committed-secret scan
# (nomorals.tools.secret_scan over the repo's own pattern battery, with
# .secret-scan-allowlist.json excusing adjudicated non-secrets by exact
# value hash). Both were advisory until Wave 8; see docs/CI_GATES.md.
#
# Deliberately OMITTED: Termux / aarch64.
#   GitHub has no first-party aarch64 Termux runner, and third-party
#   emulation actions (userland/proot Android images) are flaky enough that a
#   green badge would be theater, not verification. The Termux deploy path is
#   covered by docs/TERMUX_DEPLOY.md, scripts/termux/start_termux.sh, and the
#   `termux` settings profile in nomorals/core/config.py. Revisit if a
#   self-hosted ARM runner becomes available.

name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  ci:
    name: "CI (py${{ matrix.python-version }}, shard ${{ matrix.shard }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # NOTE: pyproject.toml sets requires-python >= 3.11, so 3.10 is out.
        python-version: ["3.11", "3.12"]
        # Deterministic file-level shards of the one pytest population
        # (see the suite step): shard N takes every 2nd collected file.
        shard: [0, 1]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # NOTE: vendor/sentinel is a PRIVATE submodule — the runner cannot
      # fetch it (no credentials for it). Tests that need the real bridge
      # skip gracefully when it is absent; the absent-submodule behavior
      # itself is still tested. Do NOT add a fetch step here: it fails.

      # NOTE: the `runner` context is NOT available in job-level `env`
      # (GitHub fails the whole run at evaluation time, 0s, no jobs), so
      # TMPDIR is exported here via $GITHUB_ENV instead of a job-level env:.
      - name: Point TMPDIR at the runner temp dir
        run: echo "TMPDIR=${{ runner.temp }}" >> "$GITHUB_ENV"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (ffmpeg for video tests)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Install package + dev tooling
        run: |
          python3 -m pip install --upgrade pip
          # The offline suite exercises optional-acceleration paths for real
          # (numpy/pandas/Pillow/yt-dlp), so CI installs them to match a real
          # dev checkout; pyyaml is for the workflow self-check below;
          # python-docx/openpyxl are for the document-engine tests. None
          # are added to the package's own extras on purpose: the package
          # keeps zero mandatory dependencies.
          python3 -m pip install -e ".[dev,fast,media,media-edit]" \
            "pandas>=2" "pyyaml>=6" "python-docx>=1.1" "openpyxl>=3.1" \
            "ruff==0.17.3"

      - name: Validate this workflow parses
        run: python3 -c "import yaml; yaml.safe_load(open('.github/workflows/ci.yml'))"

      # Lint debt is RATCHETED (Wave 8): ruff-ratchet.json records the
      # per-code ceilings measured with the pinned ruff (0.17.3). The gate
      # fails when any code's count rises above its ceiling, when a new
      # code appears, or when a ceiling is stale (debt paid down but the
      # ratchet not tightened). Pay debt down, then re-record with
      # `python3 -m nomorals.tools.ruff_ratchet --update`. See
      # docs/CI_GATES.md.
      - name: Lint ratchet (ruff — debt may only decrease)
        run: python3 -m nomorals.tools.ruff_ratchet

      - name: Layering contract
        run: python3 -m pytest tests/test_layering.py

      - name: Error scan
        run: python3 -m nomorals.tools.error_scan nomorals/

      - name: Collection gate (a broken test import must fail CI)
        run: |
          # A broken test import must fail fast, before the suite runs —
          # the stale `_confidence` import once hid for days behind a
          # runner that degraded import errors to a single failure line.
          # The gate collects with the same runner that executes.
          python3 -m pytest tests --collect-only -q

      - name: Offline unit suite (NM_RUN_INTEGRATION unset, shard ${{ matrix.shard }})
        # Budget: the full pytest population (TestCase classes AND plain
        # functions) across 2 deterministic shards; re-measure on the
        # first runs and record in docs/SUITE_RUNTIME.md.
        timeout-minutes: 90
        run: |
          if [ -n "${NM_RUN_INTEGRATION:-}" ]; then
            echo "NM_RUN_INTEGRATION is set on the runner; refusing to run the offline suite with it" >&2
            exit 1
          fi
          # Deterministic shard selection: sort the collected test files
          # and take every 2nd one (NR is 1-based; shard 0 takes even
          # lines, shard 1 odd). Fall back to the plain file listing if
          # the collect output shape ever changes under us.
          python3 -m pytest tests --collect-only -q 2>/dev/null \
            | grep -oE '^tests/[^:]+\.py' | sort -u > /tmp/all_files.txt || true
          if [ ! -s /tmp/all_files.txt ]; then
            ls tests/test_*.py | sort > /tmp/all_files.txt
          fi
          awk -v s=${{ matrix.shard }} 'NR % 2 == s' /tmp/all_files.txt \
            > /tmp/shard_files.txt
          echo "shard ${{ matrix.shard }}: $(wc -l < /tmp/shard_files.txt) of $(wc -l < /tmp/all_files.txt) files"
          # Collected identity count for THIS shard, recorded so the
          # executed-vs-collected drift is visible in every run's log.
          # pytest's quiet collect output has three shapes (per-file
          # counts, a summary line, or bare nodeids); accept all three.
          python3 -m pytest $(cat /tmp/shard_files.txt) \
            --collect-only -q 2>/dev/null > /tmp/collected.txt || true
          COLLECTED=$(grep -oE ': [0-9]+$' /tmp/collected.txt \
            | grep -oE '[0-9]+' | awk '{n += $1} END {print n + 0}')
          if [ -z "$COLLECTED" ] || [ "$COLLECTED" = "0" ]; then
            COLLECTED=$(grep -oE '^[0-9]+ tests? collected' \
              /tmp/collected.txt | grep -oE '^[0-9]+' | tail -1)
          fi
          if [ -z "$COLLECTED" ] || [ "$COLLECTED" = "0" ]; then
            COLLECTED=$(grep -c '::' /tmp/collected.txt || true)
          fi
          echo "collected (shard): $COLLECTED"
          # NB: GitHub runs this under `bash -e`; capture the exit code
          # with `||` so a failing suite doesn't skip the report below.
          python3 -m pytest $(cat /tmp/shard_files.txt) \
            --junitxml=/tmp/junit.xml > /tmp/suite.log 2>&1 || CODE=$?
          echo "=== SUITE SUMMARY (shard ${{ matrix.shard }}) ==="
          tail -2 /tmp/suite.log || true
          python3 - "$COLLECTED" <<'PYEOF'
          import sys
          import xml.etree.ElementTree as ET

          collected = sys.argv[1] or "?"
          try:
              suite = ET.parse("/tmp/junit.xml").getroot()
              if suite.tag == "testsuites":
                  suite = suite.find("testsuite")
              g = lambda k: int(suite.get(k, 0))  # noqa: E731
              executed, failures = g("tests"), g("failures")
              errors, skipped = g("errors"), g("skipped")
              print(f"EXECUTED_VS_COLLECTED collected={collected} "
                    f"executed={executed} passed={executed - failures - errors - skipped} "
                    f"failed={failures} errors={errors} skipped={skipped}")
              if str(executed) != str(collected):
                  # Visible, not fatal: module-level skips legitimately
                  # compress several collected items into one report.
                  print(f"NOTE: executed != collected (delta "
                        f"{executed - int(collected) if collected.isdigit() else '?'}); "
                        "inspect for deselection drift")
          except Exception as exc:  # noqa: BLE001 - report, never mask the suite result
              print(f"EXECUTED_VS_COLLECTED collected={collected} "
                    f"executed=UNPARSED ({type(exc).__name__}: {exc})")
          PYEOF
          echo "=== FAILURES (first 30) ==="
          grep -E "^FAILED" /tmp/suite.log | head -30 || true
          exit ${CODE:-0}

      - name: Upload suite report (shard ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-py${{ matrix.python-version }}-shard${{ matrix.shard }}
          path: |
            /tmp/junit.xml
            /tmp/suite.log
          if-no-files-found: ignore

  # ── Committed-secret GATE (Wave 8): runs the repo's own secret-pattern
  # battery (nomorals.security.audit_patterns) over every tracked file and
  # FAILS the run on any hit not excused by .secret-scan-allowlist.json
  # (entries key on path + pattern + SHA-256 of the matched value, so a
  # different secret at the same path still fails). One battery, one gate —
  # no grep copy. Disclosure playbook: docs/CI_GATES.md.
  secret-scan:
    name: "secret-scan (gate)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # NOTE: vendor/sentinel is private — the runner cannot fetch it.
      # (Skipped here; nothing secret lives in the submodule checkout.)

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Committed-secret gate
        run: python3 -m nomorals.tools.secret_scan
