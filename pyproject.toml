[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nomorals"
version = "0.1.0"
description = "NoMorals Core: a self-hosted, self-improving multi-agent personal AI substrate."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "NoMorals Core" }]
keywords = ["ai", "agents", "multi-agent", "llm", "autonomous", "self-improving"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The core package has ZERO mandatory third-party dependencies.
# Everything below is optional acceleration. The system degrades gracefully
# without any of it (see nomorals/core/compat.py).
dependencies = []

[project.optional-dependencies]
# Numerical acceleration for the vector store and native trainer.
fast = ["numpy>=1.24"]
# Media download and processing.
media = ["yt-dlp>=2024.4.9"]
# Media editing engine (Pillow + OpenCV + scikit-image advanced ops;
# ffmpeg used from PATH).
media-edit = ["Pillow>=10.0", "opencv-python-headless>=4.8",
              "scikit-image>=0.22"]
# Local model training on GPU.
train = ["torch>=2.1", "transformers>=4.38", "datasets>=2.17", "peft>=0.9"]
# Fine-tuning backends.
finetune = ["unsloth", "trl>=0.8"]
# Hugging Face model management.
hub = ["huggingface-hub>=0.22"]
# Technical analysis, finance, data science.
ta = ["numpy>=1.24", "pandas>=1.5", "matplotlib>=3.7", "scikit-learn>=1.3"]
# Data science workspace.
datasci = ["pandas>=1.5", "matplotlib>=3.7"]
# Document parsing (office formats, OCR).
docs = ["python-docx>=1.1", "openpyxl>=3.1", "pytesseract>=0.3", "pdf2image>=1.17"]
# Voice: TTS/STT engines.
voice = ["edge-tts>=6.1", "openai-whisper>=20231117", "sounddevice>=0.4"]
# Chat adapters.
chat = ["telethon>=1.36", "discord.py>=2.3"]
# Cloud connectors.
cloud = ["boto3>=1.34", "paramiko>=3.4"]
# MongoDB document-store backend (storage/docstore.py). Optional by the
# zero-dependency law: without it, Devon serves the SQLite rung and the
# backend status reports "driver_missing" instead of failing.
mongo = ["pymongo>=4.6"]
# Image generation.
genimg = ["diffusers>=0.27", "rembg>=2.0"]
# Browser automation.
browser = ["playwright>=1.42"]
# Configuration formats.
config = ["pyyaml>=6.0"]
# ApkForge static analysis (pure Python: androguard parses, APKiD
# fingerprints packers/compilers; runs on the Termux profile too).
apk = ["androguard>=4.0", "apkid>=2.1"]
# Development / test tooling.
dev = ["pytest>=7.4", "ruff>=0.3"]
# Everything.
all = ["nomorals[fast,media,media-edit,train,finetune,hub,ta,datasci,docs,voice,chat,cloud,mongo,genimg,browser,config,apk,dev]"]

# Everything. Install this and Devon just works — no pip-hint chasing.

[project.scripts]
nm = "nomorals.cli:main"
nmctl = "nomorals.cli:main"

[tool.setuptools]
# Runtime data assets ship with the code that loads them by __file__-
# relative paths. include-package-data + MANIFEST.in give the sdist the
# same inventory; the explicit package-data table below pins the wheel.
# Deliberately EXCLUDED: nomorals/games/data/tournaments/t*.json — those
# are runtime-written tournament state (Tournament.save() writes
# t<epoch-millis>.json next to the code), not seed assets; an installed
# package must not ship another machine's game state.
include-package-data = true

[tool.setuptools.packages.find]
include = ["nomorals*"]

[tool.setuptools.package-data]
"nomorals.i18n" = ["catalogs/*.tsv"]
"nomorals.skills" = ["library/*.md", "layers/*.md"]
"nomorals.media_edit" = ["workflows/*.json"]
"nomorals.assets" = ["library.json"]
"nomorals.commitments" = ["library.json"]
"nomorals.decisions" = ["library.json"]
"nomorals.focus" = ["library.json"]
"nomorals.household" = ["library.json"]
"nomorals.identity" = ["library.json"]
"nomorals.legacy" = ["library.json"]
"nomorals.life" = ["library.json"]
"nomorals.meta" = ["library.json"]
"nomorals.people" = ["library.json"]
"nomorals.preferences" = ["library.json"]
"nomorals.publicface" = ["library.json"]
"nomorals.pulses" = ["library.json"]
"nomorals.retrieval" = ["library.json"]
"nomorals.reviews" = ["library.json"]
"nomorals.scam" = ["library.json"]
"nomorals.shows" = ["library.json"]
"nomorals.sources" = ["library.json"]
"nomorals.media.upgrade" = ["library.json"]
# Builder templates are copied wholesale by scaffold.copytree, so the
# whole tree ships (code files, READMEs, requirements, data) — two depth
# patterns cover the tree's actual depth; MANIFEST.in mirrors it.
"nomorals.builders" = ["templates/*/*", "templates/*/*/*"]
"nomorals.wisdom" = ["data/*.json", "sessions/*.json"]
"nomorals.agents.braineval" = ["data/*.json", "data/cases/*.jsonl"]
"nomorals.games" = ["data/words.txt"]
"nomorals.training" = ["seeds/*.jsonl"]
"nomorals.agents.reverse" = ["pins/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]
