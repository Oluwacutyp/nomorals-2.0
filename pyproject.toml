[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nomorals"
version = "0.1.0"
description = "NoMorals Core: a self-hosted, self-improving multi-agent personal AI substrate."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "NoMorals Core" }]
keywords = ["ai", "agents", "multi-agent", "llm", "autonomous", "self-improving"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The core package has ZERO mandatory third-party dependencies.
# Everything below is optional acceleration. The system degrades gracefully
# without any of it (see nomorals/core/compat.py).
dependencies = []

[project.optional-dependencies]
# Numerical acceleration for the vector store and native trainer.
fast = ["numpy>=1.24"]
# Media download and processing.
media = ["yt-dlp>=2024.4.9"]
# Media editing engine (Pillow + OpenCV + scikit-image advanced ops;
# ffmpeg used from PATH).
media-edit = ["Pillow>=10.0", "opencv-python-headless>=4.8",
              "scikit-image>=0.22"]
# Local model training on GPU.
train = ["torch>=2.1", "transformers>=4.38", "datasets>=2.17", "peft>=0.9"]
# Fine-tuning backends.
finetune = ["unsloth", "trl>=0.8"]
# Hugging Face model management.
hub = ["huggingface-hub>=0.22"]
# Technical analysis, finance, data science.
ta = ["numpy>=1.24", "pandas>=1.5", "matplotlib>=3.7", "scikit-learn>=1.3"]
# Data science workspace.
datasci = ["pandas>=1.5", "matplotlib>=3.7"]
# Document parsing (office formats, OCR).
docs = ["python-docx>=1.1", "openpyxl>=3.1", "pytesseract>=0.3", "pdf2image>=1.17"]
# Voice: TTS/STT engines.
voice = ["edge-tts>=6.1", "openai-whisper>=20231117", "sounddevice>=0.4"]
# Chat adapters.
chat = ["telethon>=1.36", "discord.py>=2.3"]
# Cloud connectors.
cloud = ["boto3>=1.34", "paramiko>=3.4"]
# Image generation.
genimg = ["diffusers>=0.27", "rembg>=2.0"]
# Browser automation.
browser = ["playwright>=1.42"]
# Configuration formats.
config = ["pyyaml>=6.0"]
# Development / test tooling.
dev = ["pytest>=7.4", "ruff>=0.3"]
# Everything.
all = ["nomorals[fast,media,media-edit,train,finetune,hub,ta,datasci,docs,voice,chat,cloud,genimg,browser,config,dev]"]

# Everything. Install this and Devon just works — no pip-hint chasing.

[project.scripts]
nm = "nomorals.cli:main"
nmctl = "nomorals.cli:main"

[tool.setuptools.packages.find]
include = ["nomorals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]
