# Craft-Libs parity (lane 113). Real fixtures + operations + expected
# outcomes for the shared libraries. A missing fixture fails, never
# skips. Noise values are the textures/material parity pins (seed 7).

[[cases]]
id = "noise-point-value"
operation = "noise_point"
function = "point_value"
point = [0.0, 0.0, 0.0]
seed = 7
expected = 0.044569507

[[cases]]
id = "noise-point-perlin"
operation = "noise_point"
function = "point_perlin"
point = [0.5, 0.25, 0.125]
seed = 7
expected = 0.502421975

[[cases]]
id = "noise-point-fbm"
operation = "noise_point"
function = "point_fbm"
point = [0.5, 0.25, 0.125]
octaves = 5
seed = 7
base = "point_value"
expected = 0.337487936

[[cases]]
id = "noise-point-cellular"
operation = "noise_point"
function = "point_cellular"
point = [0.5, 0.25, 0.125]
seed = 7
component = 0
expected = 0.851551

[[cases]]
id = "noise-point-worley"
operation = "noise_point"
function = "point_worley"
point = [0.5, 0.25, 0.125]
seed = 7
expected = 0.851551

