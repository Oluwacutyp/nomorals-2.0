# Kinect parity — machine-checked expectations for the k4a port.
#
# Every value here was measured, not asserted: enum values were
# re-parsed from the vendored k4atypes.h, struct layouts from a
# gcc sizeof/offset probe, fixture geometry from running the code,
# and the sdk_* cases compare this port's geometry against the
# REAL libk4a 1.4.2 binary on this box — same calibration, same
# points — so the math is checked against the SDK, not itself.
# Fixtures live in tests/fixtures/kinect/.

[schema]
version = 1

[[case]]
id = "enum-depth-mode"
op = "enum_values"
[case.expect.values]
K4A_DEPTH_MODE_OFF = 0
K4A_DEPTH_MODE_NFOV_2X2BINNED = 1
K4A_DEPTH_MODE_NFOV_UNBINNED = 2
K4A_DEPTH_MODE_WFOV_2X2BINNED = 3
K4A_DEPTH_MODE_WFOV_UNBINNED = 4
K4A_DEPTH_MODE_PASSIVE_IR = 5

