# Kinect attribution — SHA-256 provenance for the k4a port.
#
# Upstream: storytold/k4a-sys-temp, commit
# ffc38156faca14a44fb2c489049c8bf9d4959f5a ("bump version to
# 0.2.3"), MIT (Copyright 2020 Amédée d'Aboville, LICENSE.md).
# The clone is a thin fork of k4a-sys: the whole Linux patch is
# one line in build.rs (link libk4a on Linux). Every file below
# is hash-pinned against the clone on disk; verify_attribution
# recomputes them.
#
# The calibration fixture is NOT from that clone: it is the
# Azure Kinect Sensor SDK's own unit-test calibration JSON
# (microsoft/Azure-Kinect-Sensor-SDK, MIT), extracted from
# tests/UnitTests/utcommon/inc/ut_calibration_data.h (v1.4.1)
# and stored as tests/fixtures/kinect/calibration.json. It is
# pinned under [[sdk]] against the repo file itself.

