# DeckCraft parity — machine-checked cases over real .pptx fixtures.
# Fixtures live in tests/fixtures/deckcraft/ and are generated by
# ~/workspace/deckcraft-verify/gen_fixtures.py (Devon's own writer
# code — never PowerPoint-produced). A missing fixture fails its
# case, never a silent skip.
schema_version = 1

[[cases]]
id = "simple-inspect"
fixture = "simple.pptx"
ops = ["inspect"]
[cases.expect]
slides = 2
shapes = 6
tables = 1
images = 0
charts = 0
title = "Simple Fixture"
text_contains = ["First point", "Simple Fixture"]

[[cases]]
id = "simple-replace"
fixture = "simple.pptx"
ops = ["replace"]
[cases.op_args]
old = "First point"
new = "Opening point"
[cases.expect]
text_contains = ["Opening point"]
parts_preserved = true
untouched_slides_changed = 0

[[cases]]
id = "simple-restyle"
fixture = "styled.pptx"
ops = ["restyle-run"]
[cases.op_args]
slide = 0
shape = 1
para = 0
run = 0
bold = false
italic = true
color = "00FF00"
size_half_points = 48
[cases.expect]
parts_preserved = true
untouched_slides_changed = 0

[[cases]]
id = "simple-add-slide"
fixture = "simple.pptx"
ops = ["add-slide"]
[cases.op_args]
layout = "content"
title = "New Slide"
[cases.expect]
slides = 3
text_contains = ["New Slide"]

[[cases]]
id = "simple-add-table"
fixture = "simple.pptx"
ops = ["add-table"]
[cases.op_args]
slide = 0
headers = ["A", "B"]
rows = [["1", "2"]]
[cases.expect]
tables = 2
shapes = 7

[[cases]]
id = "simple-remove-slide"
fixture = "simple.pptx"
ops = ["remove-slide"]
[cases.op_args]
slide = 0
[cases.expect]
slides = 1
first_slide_text = "Content"

[[cases]]
id = "simple-reorder"
fixture = "simple.pptx"
ops = ["reorder"]
[cases.op_args]
from = 0
to = 1
[cases.expect]
slides = 2
first_slide_text = "Content"

[[cases]]
id = "styled-inspect"
fixture = "styled.pptx"
ops = ["inspect"]
[cases.expect]
slides = 1
images = 1
transition = "fade"
text_contains = ["Bold Red"]

[[cases]]
id = "charts-inspect"
fixture = "charts.pptx"
ops = ["inspect"]
[cases.expect]
slides = 1
charts = 1
tables = 1
text_contains = ["Charts"]

[[cases]]
id = "broken-open-refused"
fixture = "broken.pptx"
ops = ["open-refused"]
[cases.expect]
error_kind = "parse"
