# PdfCraft attribution — SHA-256 provenance for the port.
# Port of the storytold/pdfcraft ATTRIBUTION.toml design: one [[asset]]
# per file, with source, licence, and the SHA-256 of the file as read.
# `verify_attribution` in nomorals/documents/pdfcraft/attribution.py
# recomputes the hashes against the upstream clone, so provenance is
# checkable at runtime, not a comment.
#
# Upstream: storytold/pdfcraft, commit 8717a085ffec6b6de3ffa86de9c0c51da1488000
# (clone: ~/workspace/echelon-mining/repos/storytold/pdfcraft).
# Licence: MIT OR Apache-2.0 (LICENSE-MIT + LICENSE-APACHE in the clone).
# The port takes the DESIGN (object model shape, incremental/full save
# split, parity TOML schema, attribution record shape) — Devon's code is
# written fresh in Python; no upstream source text is copied.

