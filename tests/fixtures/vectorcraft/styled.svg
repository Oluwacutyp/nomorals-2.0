<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 300 200">
  <title>Styled Fixture</title>
  <defs>
    <linearGradient id="grad1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff0000"/>
      <stop offset="1" stop-color="#0000ff"/>
    </linearGradient>
    <radialGradient id="grad2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#00aa00"/>
    </radialGradient>
  </defs>
  <g id="layer1" opacity="0.9">
    <rect x="10" y="10" width="100" height="60" fill="url(#grad1)"/>
    <ellipse cx="200" cy="40" rx="60" ry="30" fill="url(#grad2)" stroke="#333333" stroke-width="3" stroke-dasharray="6 3"/>
  </g>
  <g transform="translate(0,100)">
    <line x1="10" y1="10" x2="290" y2="10" stroke="#000000" stroke-width="2"/>
    <polygon points="40,80 90,30 140,80" fill="#ffcc00" fill-rule="evenodd"/>
  </g>
</svg>
