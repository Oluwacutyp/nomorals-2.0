    .hot { fill: #ff0000; stroke: #000000; stroke-width: 2; }
    rect.cool { fill: #0000ff; }
  </style>
  <rect class="hot" x="10" y="10" width="80" height="60"/>
  <rect class="cool" x="110" y="10" width="80" height="60" style="opacity: 0.5"/>
