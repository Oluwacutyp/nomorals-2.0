# VITS attribution — SHA-256 provenance for every upstream file ported
# from storytold/vits-finetuning (MIT, Copyright (c) 2021 Jaehyeon Kim),
# commit b1e03be ("Add Bin loss"). Verified by tests/test_gapfix_vits.py.
#
# Convention: sha256 is the hash of the file as it sits in this repo;
# upstream_sha256 is the hash of the upstream file it came from, present
# exactly when the port adapted the file (import rewrites, documented
# fixes). Byte-identical vendored files carry no upstream_sha256.
#
# Two vendored configs were fixed: ljs_li44_tmbert_ft_small_s1_arpa.json
# and ljs_li44_tmbert_s1_arpa_mid.json both miss the comma after
# "use_8bit": true upstream (invalid JSON); the vendored copies add it.
# ljs_li44_tmbert_small_s1_arpa.json parses fine upstream and is unchanged.
#
# TorchMoji weights (moji/model/pytorch_model.bin) are NOT in the clone
# and are NOT vendored; the frontend fails honestly until they are placed
# at nomorals/voice/vits/data/pytorch_model.bin.

# Lane 120 fix-up (ruff): 30 vendored files were reformatted
# (import order / %-format and .format() to f-strings / zip
# strict=True / dead-code removal); their sha256 values were
# re-measured after the reformat. Three files that were
# byte-identical to upstream (transforms.py, moji/lstm.py,
# moji/attlayer.py) gained upstream_sha256 + note entries.
#
